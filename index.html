    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8fafc;
        }
        .font-brand {
            font-family: 'Montserrat', sans-serif;
        }
        
        .water-drops {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/water-drops.png');
            opacity: 0.12;
            pointer-events: none;
            z-index: 1;
        }

        .glass {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        @keyframes float3d {
            0%, 100% { transform: translateY(0) rotateY(-8deg) rotateX(2deg); }
            50% { transform: translateY(-15px) rotateY(8deg) rotateX(-2deg); }
        }

        .animate-dispenser-3d {
            animation: float3d 8s ease-in-out infinite;
            transform-style: preserve-3d;
        }

        .gold-shimmer {
            position: relative;
            overflow: hidden;
        }
        .gold-shimmer::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 45%,
                rgba(255, 255, 255, 0.1) 50%,
                transparent 55%
            );
            animation: shimmer 4s infinite;
        }
        @keyframes shimmer {
            0% { transform: translate(-30%, -30%); }
            100% { transform: translate(30%, 30%); }
        }
    </style>
